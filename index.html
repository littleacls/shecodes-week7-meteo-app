<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>Forecast App</title>
  </head>
  <body>
    <header>
      <form class="search-form" id="search-form">
        <input
          type="search"
          placeholder="Enter a city..."
          required
          class="search-form-input"
          id="search-input"
        />
        <button type="submit" class="search-form-button">Search</button>
      </form>
    </header>
    <div class="weather-app">
      <main>
        <p><span id="city"></span>, <span id="country"></span></p>
        <p><span id="date"></span></p>
        <h1>
          <span id="icon"></span>
          <br />
          <span id="temperature">24</span>°C
        </h1>
        <p>
          <span id="description">Clear Skies</span>
          <br />
          Feels like <span id="feels-like">22</span>°C
        </p>
        <div class="container">
          <div>
            💧
            <br />
            <span id="humidity"></span>
            <br />
            Humidity
          </div>
          <div>
            💨
            <br />
            <span id="wind"></span>
            <br />
            Wind
          </div>
        </div>
      </main>
    </div>
    <footer>
      This project was coded by
      <a href="https://github.com/littleacls" target="_blank">Ana Lucianetti</a>
      and is
      <a
        href="https://github.com/littleacls/shecodes-week7-meteo-app"
        target="_blank"
        >open-sourced on GitHub</a
      >
      and hosted
      <a href="https://myshecodesplusweatherapp.netlify.app/" target="_blank"
        >on Netlify</a
      >
    </footer>
    <script src="src/script.js"></script>
  </body>
</html>
