<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>Forecast App</title>
  </head>
  <body>
    <header>
      <form class="search-form">
        <input
          type="search"
          placeholder="Enter a city..."
          required
          class="search-form-input"
        />
        <button type="submit" class="search-form-button">Search</button>
      </form>
    </header>
    <div class="weather-app">
      <main>
        <p>BARCELONA</p>
        <p>Wednesday, June 10</p>
        <h1>
          ☀️
          <br />
          24°C
        </h1>
        <p>
          Clear Skies
          <br />
          Feels like 22°C
        </p>
        <div class="container">
          <div>
            💧
            <br />
            55%
            <br />
            Humidity
          </div>
          <div>
            💨
            <br />
            14km/h
            <br />
            Wind
          </div>
        </div>
      </main>
    </div>
    <footer>
      This project was coded by
      <a href="https://github.com/littleacls" target="_blank">Ana Lucianetti</a>
      and is
      <a
        href="https://github.com/littleacls/shecodes-week7-meteo-app"
        target="_blank"
        >open-sourced on GitHub</a
      >
      and hosted
      <a href="https://myshecodesplusweatherapp.netlify.app/" target="_blank"
        >on Netlify</a
      >
    </footer>
  </body>
</html>
